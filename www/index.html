<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080C">
<title>プラズマタッチ検証ページ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="プラズマタッチ">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#05080C;overflow:hidden}
  body{
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* 画面に溶け込ませる */
  #brand{
    position:fixed;left:0;right:0;
    top:calc(env(safe-area-inset-top) + 16px);
    text-align:center;pointer-events:none;
    font-size:10.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(150,200,230,.20);
    transition:color 1.2s ease;
  }
  body.live #brand{color:rgba(150,200,230,.09)}

  #hint{
    position:fixed;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom) + 22px);
    text-align:center;pointer-events:none;
    font-size:11.5px;letter-spacing:.22em;text-indent:.22em;
    color:rgba(150,200,230,.26);
    transition:opacity 1.4s ease;
  }
  #hint.gone{opacity:0}
  #hint .sub{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.16em;text-indent:.16em;opacity:.62}

  #sndName{
    position:fixed;left:0;right:0;
    top:calc(env(safe-area-inset-top) + 42px);
    text-align:center;pointer-events:none;
    font-size:11px;letter-spacing:.34em;text-indent:.34em;
    color:rgba(150,200,230,0);
    transition:color .55s ease;
  }
  #sndName.show{color:rgba(150,200,230,.45)}

  /* セーフエリアの実寸を測るためだけの要素 */
  #safe{
    position:fixed;left:0;bottom:0;width:1px;height:1px;
    padding-bottom:env(safe-area-inset-bottom);
    visibility:hidden;pointer-events:none;
  }
  @media (prefers-reduced-motion:reduce){#brand,#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="brand">プラズマタッチ検証ページ</div>
<div id="sndName"></div>
<div id="hint">画面に触れてください<br><span class="sub">右端を3回タップで音が変わる ／ 左端で戻る</span></div>
<div id="safe"></div>

<script>
(function(){
  "use strict";
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var brandEl=document.body, hintEl=document.getElementById('hint'), safeEl=document.getElementById('safe');

  var S={
    active:false, strength:0, target:0,
    x:0, y:0, W:0, H:0, safeB:0,
    area:NaN, pressure:NaN, w:NaN, h:NaN,
    pMin:null, pMax:null, aMin:null, aMax:null, src:'area'
  };

  /* ---------- サイズとコイルの配置（端末ごとに実測） ---------- */
  var DPR=Math.min(window.devicePixelRatio||1,2);
  var coil={};
  function measure(){
    var w=Math.round(window.innerWidth), h=Math.round(window.innerHeight);
    if(w===S.W && h===S.H) return;
    S.W=w; S.H=h;
    cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);

    S.safeB=parseFloat(getComputedStyle(safeEl).paddingBottom)||0;

    // コイルの大きさは画面の短辺から決める。どの端末でも必ず画面内に収まる。
    var u=Math.min(w,h);
    coil.rx=Math.max(18,Math.min(48,u*0.085));
    coil.ry=coil.rx*0.34;
    coil.wind=Math.max(34,Math.min(90,u*0.115));   // 巻線の高さ
    coil.baseY=h-S.safeB-14;                        // 台座
    coil.y=coil.baseY-8-coil.wind;                  // トロイド中心（＝発生源）
    coil.x=w/2;

    if(!S.active){ S.x=w/2; S.y=h*0.34; }
  }
  window.addEventListener('resize',measure);
  window.addEventListener('orientationchange',function(){ setTimeout(measure,250); });
  if(window.visualViewport) window.visualViewport.addEventListener('resize',measure);

  /* ---------- 強度 ---------- */
  function readPointer(e){
    if(typeof e.pressure==='number') S.pressure=e.pressure;
    if(typeof e.width==='number'&&e.width>0) S.w=e.width;
    if(typeof e.height==='number'&&e.height>0) S.h=e.height;
    if(S.w>0&&S.h>0) S.area=S.w*S.h;
    S.x=e.clientX; S.y=e.clientY;
    if(isFinite(S.pressure)){
      if(S.pMin===null||S.pressure<S.pMin) S.pMin=S.pressure;
      if(S.pMax===null||S.pressure>S.pMax) S.pMax=S.pressure;
    }
    if(isFinite(S.area)){
      if(S.aMin===null||S.area<S.aMin) S.aMin=S.area;
      if(S.aMax===null||S.area>S.aMax) S.aMax=S.area;
    }
    // pressure が動く端末ならそれを使う（0〜1 正規化済みで校正不要）
    S.src=(S.pMin!==null&&(S.pMax-S.pMin)>0.02)?'pressure':'area';
  }
  function clamp01(v){ return !isFinite(v)?0:Math.max(0,Math.min(1,v)); }
  function computeTarget(){
    if(S.src==='pressure') return clamp01(S.pressure);
    if(S.aMin===null) return 0;
    var span=S.aMax-S.aMin;
    if(span<1e-6) return 0.2;
    var lo=S.aMin, hi=S.aMax;
    if(span<lo*0.12) hi=lo+lo*0.12;
    return clamp01((S.area-lo)/(hi-lo));
  }

  /* ---------- カーブ ---------- */
  // 振動: 25%まで最小、55%から一気に、95%で最大
  function vibCurve(s){
    s=clamp01(s);
    if(s<=0.25) return 0;
    if(s<0.55) return ((s-0.25)/0.30)*0.12;
    var t=Math.min(1,(s-0.55)/0.40);
    return 0.12+(t*t*(3-2*t))*0.88;
  }
  // 見た目: 35%まで地味、55%から一気に、95%で最大
  function visCurve(s){
    s=clamp01(s);
    if(s<=0.35) return 0;
    if(s<0.55) return ((s-0.35)/0.20)*0.15;
    var t=Math.min(1,(s-0.55)/0.40);
    return 0.15+(t*t*(3-2*t))*0.85;
  }

  /* ---------- 音 ---------- */
  // 4系統を並列に組んでおき、ゲインで切り替える。切り替えでプツッと切れないよう 短くクロスフェードする。
  var A=null, audioUnlocked=false;
  var DBG=/[?&]debug=1/.test(location.search);
  var SOUNDS=['コイル','アーク','コロナ','ハム'];
  var MODE_GAIN=[0.55, 0.85, 0.32, 0.75];   // 系統ごとに体感音量が違うので個別に調整
  var sndIdx=0;
  try{ var sv=localStorage.getItem('pt.snd'); if(sv!==null) sndIdx=Math.min(3,Math.max(0,parseInt(sv,10)||0)); }catch(e){}

  function audioCreate(){
    if(A) return A;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    var ac=new AC();

    var len=Math.floor(ac.sampleRate*2);
    var buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var noise=ac.createBufferSource(); noise.buffer=buf; noise.loop=true;

    var lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9500;
    var master=ac.createGain(); master.gain.value=0;
    lp.connect(master); master.connect(ac.destination);
    function bus(){ var g=ac.createGain(); g.gain.value=0; g.connect(lp); return g; }
    var gA=bus(), gB=bus(), gC=bus(), gD=bus();

    // ① コイル — 方形波で規則的に断続させる（従来の音）
    var bpA=ac.createBiquadFilter(); bpA.type='bandpass'; bpA.frequency.value=1000; bpA.Q.value=1.5;
    var amA=ac.createGain(); amA.gain.value=0.34;
    var lfoA=ac.createOscillator(); lfoA.type='square'; lfoA.frequency.value=30;
    var lfoAD=ac.createGain(); lfoAD.gain.value=0.34;
    lfoA.connect(lfoAD); lfoAD.connect(amA.gain);
    var sawA=ac.createOscillator(); sawA.type='sawtooth'; sawA.frequency.value=30;
    var sawAG=ac.createGain(); sawAG.gain.value=0;
    noise.connect(bpA); bpA.connect(amA); amA.connect(gA);
    sawA.connect(sawAG); sawAG.connect(gA);

    // ② アーク — 火花を1発ずつ不規則に打つ。周期を持たせないのが要点。
    var bpB=ac.createBiquadFilter(); bpB.type='bandpass'; bpB.frequency.value=2600; bpB.Q.value=0.9;
    var sparkG=ac.createGain(); sparkG.gain.value=0.0008;
    noise.connect(bpB); bpB.connect(sparkG); sparkG.connect(gB);

    // ③ コロナ — 連続した高域のヒス。ゆっくりした揺らぎだけ。
    var hpC=ac.createBiquadFilter(); hpC.type='highpass'; hpC.frequency.value=2000;
    var amC=ac.createGain(); amC.gain.value=0.72;
    var lfoC=ac.createOscillator(); lfoC.type='sine'; lfoC.frequency.value=0.7;
    var lfoCD=ac.createGain(); lfoCD.gain.value=0.24;
    lfoC.connect(lfoCD); lfoCD.connect(amC.gain);
    noise.connect(hpC); hpC.connect(amC); amC.connect(gC);

    // ④ ハム — 低い唸り。変圧器のような重さ。
    var o1=ac.createOscillator(); o1.type='sine';     o1.frequency.value=48;
    var o2=ac.createOscillator(); o2.type='sine';     o2.frequency.value=96.7;
    var o3=ac.createOscillator(); o3.type='triangle'; o3.frequency.value=146;
    var g1=ac.createGain(); g1.gain.value=0.55;
    var g2=ac.createGain(); g2.gain.value=0.20;
    var g3=ac.createGain(); g3.gain.value=0.05;
    var lpD=ac.createBiquadFilter(); lpD.type='lowpass'; lpD.frequency.value=800;
    var nzD=ac.createGain(); nzD.gain.value=0.05;
    o1.connect(g1); o2.connect(g2); o3.connect(g3);
    g1.connect(gD); g2.connect(gD); g3.connect(gD);
    noise.connect(lpD); lpD.connect(nzD); nzD.connect(gD);

    try{ noise.start(0); lfoA.start(0); sawA.start(0); lfoC.start(0); o1.start(0); o2.start(0); o3.start(0); }catch(e){}

    A={ctx:ac, master:master, gA:gA,gB:gB,gC:gC,gD:gD,
       bpA:bpA, lfoA:lfoA, sawA:sawA, sawAG:sawAG,
       bpB:bpB, sparkG:sparkG,
       hpC:hpC, lfoC:lfoC,
       o1:o1,o2:o2,o3:o3,g3:g3};
    applySound(true);
    return A;
  }

  function applySound(instant){
    if(!A) return;
    var t=A.ctx.currentTime, tc=instant?0.001:0.09;
    var g=[A.gA,A.gB,A.gC,A.gD];
    for(var i=0;i<4;i++) g[i].gain.setTargetAtTime(i===sndIdx?1:0,t,tc);
  }

  // iOS の解錠。pointerdown だけでは開かないことがあるので touchend / click でも試し、
  // さらに「無音を1サンプル鳴らす」という手順を踏む。これが無いと resume() が通らない端末がある。
  function audioUnlock(){
    var a=audioCreate();
    if(!a) return;
    var ac=a.ctx;
    try{
      var b=ac.createBuffer(1,1,ac.sampleRate);
      var src=ac.createBufferSource();
      src.buffer=b; src.connect(ac.destination); src.start(0);
    }catch(e){}
    if(ac.state!=='running'){
      var pr=ac.resume();
      if(pr&&pr.then) pr.then(function(){ audioUnlocked=(ac.state==='running'); }).catch(function(){});
    } else audioUnlocked=true;
  }
  ['touchstart','touchend','click','pointerdown'].forEach(function(ev){
    document.addEventListener(ev,audioUnlock,{passive:true});
  });

  // 見た目より下に床を作る。軽く触れただけでも小さく鳴る。
  function audioLevel(s){ return 0.12*Math.min(1,s*3)+0.88*visCurve(s); }

  // アーク用。1発ずつ時刻を決めて打つので、周期が揃わない。
  var sparkNext=0;
  function scheduleSparks(a){
    var ac=A.ctx, t=ac.currentTime, g=A.sparkG.gain;
    if(sparkNext<t+0.01) sparkNext=t+0.01;
    var rate=3+a*a*72, horizon=t+0.13, n=0;
    while(sparkNext<horizon && n++<40){
      var peak=(0.25+Math.random()*0.75)*(0.30+a*0.70);
      var dur=0.012+Math.random()*(0.045+a*0.07);
      g.setValueAtTime(0.0008, sparkNext);
      g.linearRampToValueAtTime(peak, sparkNext+0.0015);
      g.exponentialRampToValueAtTime(0.0008, sparkNext+dur);
      sparkNext += Math.max(0.006, (1/rate)*(0.30+Math.random()*1.4));
    }
  }

  function audioUpdate(s){
    if(!A) return;
    var t=A.ctx.currentTime, a=audioLevel(s);
    var j=1+(Math.random()-0.5)*0.12;

    if(sndIdx===0){
      var rate=(26+a*118)*j;
      A.lfoA.frequency.setTargetAtTime(rate,t,0.03);
      A.sawA.frequency.setTargetAtTime(rate*0.5,t,0.03);
      A.bpA.frequency.setTargetAtTime((900+a*2700)*j,t,0.03);
      A.bpA.Q.setTargetAtTime(1.2+a*5,t,0.05);
      A.sawAG.gain.setTargetAtTime(a*a*0.06,t,0.04);
    } else if(sndIdx===1){
      A.bpB.frequency.setTargetAtTime((1400+a*3800)*j,t,0.05);
      A.bpB.Q.setTargetAtTime(0.7+a*1.8,t,0.08);
      if(a>0.002) scheduleSparks(a);
    } else if(sndIdx===2){
      A.hpC.frequency.setTargetAtTime(1400+a*4400,t,0.08);
      A.lfoC.frequency.setTargetAtTime(0.45+a*1.7,t,0.10);
    } else {
      var f=44+a*22;
      A.o1.frequency.setTargetAtTime(f,t,0.08);
      A.o2.frequency.setTargetAtTime(f*2.02,t,0.08);
      A.o3.frequency.setTargetAtTime(f*3.05,t,0.08);
      A.g3.gain.setTargetAtTime(0.015+a*0.16,t,0.08);
    }
    A.master.gain.setTargetAtTime(a*MODE_GAIN[sndIdx],t,0.03);
  }

  /* ---------- 3タップで音を切り替える ---------- */
  var sndEl=document.getElementById('sndName'), sndTmr=0;
  function showSound(){
    sndEl.textContent='音  '+SOUNDS[sndIdx];
    sndEl.classList.add('show');
    clearTimeout(sndTmr);
    sndTmr=setTimeout(function(){ sndEl.classList.remove('show'); },1500);
  }
  var tapAt=0, tapN=0, tapSide=0;
  function registerTap(x,dur,moved,now){
    if(dur>320||moved>24){ tapN=0; return; }
    var side = x>S.W*0.68 ? 1 : (x<S.W*0.32 ? -1 : 0);
    if(!side){ tapN=0; return; }
    if(now-tapAt>700 || side!==tapSide){ tapN=0; tapSide=side; }
    tapAt=now; tapN++;
    if(tapN>=3){
      tapN=0;
      sndIdx=(sndIdx+(side>0?1:3))%4;
      try{ localStorage.setItem('pt.snd',String(sndIdx)); }catch(e){}
      applySound(false);
      showSound();
    }
  }

  /* ---------- 振動（Web PWM） ---------- */
  var vibTimer=null;
  function pulseSpec(s){
    var u=vibCurve(s);
    var on=Math.max(3,Math.round(4+u*36));
    var period=Math.round(130-u*90);
    return {on:on, off:Math.max(0,period-on)};
  }
  function vibFire(s){
    if(!navigator.vibrate) return;
    if(s<=0.005){ try{navigator.vibrate(0);}catch(e){} return; }
    var sp=pulseSpec(s), pat, acc=0;
    if(sp.off===0){ pat=[260]; }
    else { pat=[]; while(acc<260&&pat.length<60){ pat.push(sp.on); pat.push(sp.off); acc+=sp.on+sp.off; } }
    try{ navigator.vibrate(pat); }catch(e){}
  }
  function startVib(){
    if(vibTimer) return;
    vibFire(S.strength);
    vibTimer=setInterval(function(){
      // 指を離しても、減衰が終わるまで追従させる
      if(!S.active && S.strength<0.03){ stopVib(); return; }
      vibFire(S.strength);
    },170);
  }
  function stopVib(){
    if(vibTimer){ clearInterval(vibTimer); vibTimer=null; }
    try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
  }

  /* ---------- 稲妻 ---------- */
  function buildSeg(out,x0,y0,x1,y1,disp,depth,branch){
    if(depth<=0){ out.push(x0,y0,x1,y1); return; }
    var mx=(x0+x1)/2+(Math.random()-0.5)*disp;
    var my=(y0+y1)/2+(Math.random()-0.5)*disp;
    buildSeg(out,x0,y0,mx,my,disp*0.55,depth-1,branch);
    buildSeg(out,mx,my,x1,y1,disp*0.55,depth-1,branch);
    if(branch>0&&Math.random()<0.42){
      var bx=mx+(mx-x0)*0.9+(Math.random()-0.5)*disp;
      var by=my+(my-y0)*0.9+(Math.random()-0.5)*disp;
      buildSeg(out,mx,my,bx,by,disp*0.5,depth-1,branch-1);
    }
  }
  function strokeSegs(a,w,color){
    if(!a.length) return;
    ctx.strokeStyle=color; ctx.lineWidth=w;
    ctx.beginPath();
    for(var i=0;i<a.length;i+=4){ ctx.moveTo(a[i],a[i+1]); ctx.lineTo(a[i+2],a[i+3]); }
    ctx.stroke();
  }

  var sparks=[], rings=[], bloom=0, lastBloom=0;

  function drawCoil(v,breath){
    var c=coil;
    ctx.strokeStyle='#33485C'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(c.x-c.rx*1.5,c.baseY); ctx.lineTo(c.x+c.rx*1.5,c.baseY); ctx.stroke();
    ctx.strokeStyle='#2A3B4E'; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(var y=c.baseY-5;y>c.y+c.ry;y-=4.5){ ctx.moveTo(c.x-c.rx*0.42,y); ctx.lineTo(c.x+c.rx*0.42,y); }
    ctx.stroke();
    ctx.strokeStyle='rgba(116,214,255,'+(0.26+breath*0.14+v*0.6)+')';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(c.x,c.y,c.rx+v*4,c.ry+v*2,0,0,6.2832); ctx.stroke();
  }

  function draw(now){
    var W=S.W,H=S.H,s=S.strength,c=coil;
    var v=visCurve(s);                      // 派手さ
    var q=S.active?(0.10+v*0.90):v;         // 触れている間は最低限の存在感を残す
    var breath=0.5+0.5*Math.sin(now/2600);  // 待機中のゆっくりした呼吸

    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(5,8,12,'+(0.40-v*v*0.30)+')';
    ctx.fillRect(0,0,W,H);

    drawCoil(v,breath);

    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round'; ctx.lineJoin='round';

    // トロイドのコロナ（待機中も静かに息づく）
    var cr=c.rx*(0.9+breath*0.18)+v*Math.min(W,H)*0.16;
    var gc=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,cr);
    gc.addColorStop(0,'rgba(200,238,255,'+(0.16+breath*0.06+v*0.6)+')');
    gc.addColorStop(1,'rgba(80,180,255,0)');
    ctx.fillStyle=gc;
    ctx.beginPath(); ctx.arc(c.x,c.y,cr,0,6.2832); ctx.fill();

    if(S.active||v>0.01){
      var segs=[], b, big=Math.max(W,H);
      var disp=14+v*84;

      // ① 発生源 → 指。触れていれば必ず1本は出る（35%以下でも細く静かに）
      var main=1+Math.round(v*5);
      for(b=0;b<main;b++){
        var jx=S.x+(Math.random()-0.5)*(8+v*30);
        var jy=S.y+(Math.random()-0.5)*(8+v*30);
        buildSeg(segs,c.x,c.y,jx,jy,disp,5,v>0.25?3:1);
      }
      // ② トロイドから四方へ。最大で画面外まで届く。
      var st=Math.round(v*v*28);
      for(b=0;b<st&&segs.length<6000;b++){
        var ang=-0.08-Math.random()*Math.PI*0.84;
        var len=(0.22+Math.random()*0.78)*(0.32+v*0.90)*big;
        buildSeg(segs,c.x,c.y,c.x+Math.cos(ang)*len,c.y+Math.sin(ang)*len,20+v*72,4,v>0.45?2:1);
      }
      // ③ 指先から散る枝
      if(v>0.25){
        var sp2=Math.round((v-0.25)*16);
        for(b=0;b<sp2&&segs.length<6000;b++){
          var a3=Math.random()*6.2832, l3=22+Math.random()*(36+v*100);
          buildSeg(segs,S.x,S.y,S.x+Math.cos(a3)*l3,S.y+Math.sin(a3)*l3,16+v*32,4,1);
        }
      }

      strokeSegs(segs, 5+v*20,   'rgba(80,30,170,'+(0.06+q*0.20)+')');
      strokeSegs(segs, 2.2+v*6,  'rgba(50,160,255,'+(0.14+q*0.36)+')');
      strokeSegs(segs, 0.9+v*2.0,'rgba(225,248,255,'+(0.34+q*0.62)+')');

      var want=Math.round(v*v*7);
      for(b=0;b<want&&sparks.length<150;b++){
        var a2=Math.random()*6.2832, vv=1.6+Math.random()*(3+v*9);
        sparks.push({x:S.x,y:S.y,vx:Math.cos(a2)*vv,vy:Math.sin(a2)*vv,l:1});
      }
      if(v>0.35&&now-lastBloom>Math.max(220,700-v*420)){
        rings.push({x:c.x,y:c.y,r:c.rx,l:1});
        if(v>0.6){ bloom=Math.min(1,bloom+0.55); }
        lastBloom=now;
      }
    }

    var i;
    for(i=sparks.length-1;i>=0;i--){
      var p=sparks[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.13; p.vx*=0.984; p.vy*=0.984; p.l-=0.030;
      if(p.l<=0){ sparks.splice(i,1); continue; }
      ctx.strokeStyle='rgba(200,240,255,'+p.l+')'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2); ctx.stroke();
    }
    for(i=rings.length-1;i>=0;i--){
      var r=rings[i];
      r.r+=5+v*14; r.l-=0.032;
      if(r.l<=0){ rings.splice(i,1); continue; }
      ctx.strokeStyle='rgba(110,200,255,'+(r.l*0.34)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.2832); ctx.stroke();
    }

    // 指先の光
    if(S.active||v>0.02){
      var rr=16+v*v*Math.max(W,H)*0.46;
      var g=ctx.createRadialGradient(S.x,S.y,0,S.x,S.y,rr);
      g.addColorStop(0,'rgba(255,255,255,'+(0.30+q*0.60)+')');
      g.addColorStop(0.28,'rgba(140,220,255,'+(0.14+q*0.34)+')');
      g.addColorStop(1,'rgba(90,140,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,6.2832); ctx.fill();
    }

    if(v>0.25){ ctx.fillStyle='rgba(30,90,170,'+((v-0.25)*0.20)+')'; ctx.fillRect(0,0,W,H); }

    // 放電の閃き。点滅ではなく、膨らんで引く発光にする。
    if(bloom>0.002){
      ctx.fillStyle='rgba(185,222,255,'+(bloom*bloom*0.20)+')';
      ctx.fillRect(0,0,W,H);
      bloom*=0.90;
    } else bloom=0;

    ctx.globalCompositeOperation='source-over';
  }

  function tick(now){
    now=now||0;
    S.target=S.active?computeTarget():0;
    // 平滑化は最小限（微小な揺れが手触りの源）。離したときだけゆっくり落とす。
    S.strength+=(S.target-S.strength)*(S.active?0.35:0.055);
    if(!S.active&&S.strength<0.003) S.strength=0;

    audioUpdate(S.strength);
    if(DBG) dbgUpdate();

    draw(now);
    requestAnimationFrame(tick);
  }

  /* ---------- 入力 ---------- */
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
    S.active=true; readPointer(e);
    S.downT=performance.now(); S.downX=e.clientX; S.downY=e.clientY;
    // 一瞬のタップでも取りこぼさないよう、押した時点で立ち上げておく
    var t0=computeTarget();
    if(t0>S.strength) S.strength=t0*0.55;
    audioUnlock();
    document.body.classList.add('live');
    hintEl.classList.add('gone');
    startVib();
  });
  cv.addEventListener('pointermove',function(e){
    if(!S.active) return; e.preventDefault(); readPointer(e);
  });
  function up(e){                                  // 振動と音は減衰に追従して止まる
    if(!S.active) return;
    S.active=false;
    if(e&&typeof e.clientX==='number'){
      var now=performance.now();
      var dx=e.clientX-S.downX, dy=e.clientY-S.downY;
      registerTap(e.clientX, now-S.downT, Math.sqrt(dx*dx+dy*dy), now);
    }
  }
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',function(){ S.active=false; tapN=0; });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      S.active=false; S.strength=0; stopVib();
      if(A){ try{ A.master.gain.value=0; }catch(e){} }
    }
  });

  /* ---------- 診断（?debug=1 のときだけ出る） ---------- */
  var dbgEl=null;
  function dbgUpdate(){
    if(!dbgEl){
      dbgEl=document.createElement('div');
      dbgEl.style.cssText='position:fixed;left:8px;top:8px;z-index:9;font:11px/1.5 ui-monospace,monospace;'+
        'color:#9fe;background:rgba(0,0,0,.6);padding:6px 8px;pointer-events:none;white-space:pre';
      document.body.appendChild(dbgEl);
    }
    var a=A?A.ctx:null;
    dbgEl.textContent=
      'AudioContext : '+(a?'あり':'なし')+'\n'+
      'state        : '+(a?a.state:'-')+'\n'+
      'unlocked     : '+audioUnlocked+'\n'+
      'sampleRate   : '+(a?a.sampleRate:'-')+'\n'+
      'master.gain  : '+(a?A.master.gain.value.toFixed(3):'-')+'\n'+
      'strength     : '+S.strength.toFixed(3)+'\n'+
      'vibrate      : '+(!!navigator.vibrate)+'\n'+
      'sound        : '+sndIdx+' '+SOUNDS[sndIdx];
  }

  /* ---------- 起動 ---------- */
  measure();
  requestAnimationFrame(tick);

  // ホーム画面に追加できるようにする（埋め込み枠の中では登録しない）
  if('serviceWorker' in navigator && window.top===window.self){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
