<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080C">
<title>プラズマタッチ検証ページ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="プラズマタッチ">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#05080C;overflow:hidden}
  body{
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* 画面に溶け込ませる */
  #brand{
    position:fixed;left:0;right:0;
    top:calc(env(safe-area-inset-top) + 16px);
    text-align:center;pointer-events:none;
    font-size:10.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(150,200,230,.20);
    transition:color 1.2s ease;
  }
  body.live #brand{color:rgba(150,200,230,.09)}

  #hint{
    position:fixed;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom) + 22px);
    text-align:center;pointer-events:none;
    font-size:11.5px;letter-spacing:.22em;text-indent:.22em;
    color:rgba(150,200,230,.26);
    transition:opacity 1.4s ease;
  }
  #hint.gone{opacity:0}
  #hint .sub{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.16em;text-indent:.16em;opacity:.62}

  #sndName{
    position:fixed;left:0;right:0;
    top:calc(env(safe-area-inset-top) + 42px);
    text-align:center;pointer-events:none;
    font-size:11px;letter-spacing:.34em;text-indent:.34em;
    color:rgba(150,200,230,0);
    transition:color .55s ease;
  }
  #sndName.show{color:rgba(150,200,230,.45)}

  /* セーフエリアの実寸を測るためだけの要素 */
  #safe{
    position:fixed;left:0;bottom:0;width:1px;height:1px;
    padding-bottom:env(safe-area-inset-bottom);
    visibility:hidden;pointer-events:none;
  }
  @media (prefers-reduced-motion:reduce){#brand,#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="brand">プラズマタッチ検証ページ</div>
<div id="sndName"></div>
<div id="hint">画面に触れてください<br><span class="sub">右端を3回タップで音が変わる ／ 左端で戻る</span></div>
<div id="safe"></div>

<script>
(function(){
  "use strict";
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var brandEl=document.body, hintEl=document.getElementById('hint'), safeEl=document.getElementById('safe');

  var S={ strength:0, W:0, H:0, safeB:0,
          pMin:null, pMax:null, aMin:null, aMax:null, src:'area' };

  // 指ごとの状態。離した指も減衰しきるまで残す。
  var P={};          // pointerId -> finger（接地中）
  var FADE=[];       // 離した直後の指（減衰中）
  function fingers(){
    var a=[],id;
    for(id in P) a.push(P[id]);
    for(var i=0;i<FADE.length;i++) a.push(FADE[i]);
    return a;
  }
  function hasActive(){ for(var id in P) return true; return false; }
  function countActive(){ var n=0; for(var id in P) n++; return n; }

  /* ---------- サイズとコイルの配置（端末ごとに実測） ---------- */
  var DPR=Math.min(window.devicePixelRatio||1,2);
  var coil={};
  function measure(){
    var w=Math.round(window.innerWidth), h=Math.round(window.innerHeight);
    if(w===S.W && h===S.H) return;
    S.W=w; S.H=h;
    cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);

    S.safeB=parseFloat(getComputedStyle(safeEl).paddingBottom)||0;

    // コイルの大きさは画面の短辺から決める。どの端末でも必ず画面内に収まる。
    var u=Math.min(w,h);
    coil.rx=Math.max(18,Math.min(48,u*0.085));
    coil.ry=coil.rx*0.34;
    coil.wind=Math.max(34,Math.min(90,u*0.115));   // 巻線の高さ
    coil.baseY=h-S.safeB-14;                        // 台座
    coil.y=coil.baseY-8-coil.wind;                  // トロイド中心（＝発生源）
    coil.x=w/2;
  }
  window.addEventListener('resize',measure);
  window.addEventListener('orientationchange',function(){ setTimeout(measure,250); });
  if(window.visualViewport) window.visualViewport.addEventListener('resize',measure);

  /* ---------- 強度 ---------- */
  function clamp01(v){ return !isFinite(v)?0:Math.max(0,Math.min(1,v)); }

  // 値域の学習は全指で共有する。指ごとに校正すると基準がばらつくため。
  function readPointer(f,e){
    if(typeof e.pressure==='number') f.pressure=e.pressure;
    if(typeof e.width==='number'&&e.width>0) f.w=e.width;
    if(typeof e.height==='number'&&e.height>0) f.h=e.height;
    if(f.w>0&&f.h>0) f.area=f.w*f.h;
    f.x=e.clientX; f.y=e.clientY;
    if(isFinite(f.pressure)){
      if(S.pMin===null||f.pressure<S.pMin) S.pMin=f.pressure;
      if(S.pMax===null||f.pressure>S.pMax) S.pMax=f.pressure;
    }
    if(isFinite(f.area)){
      if(S.aMin===null||f.area<S.aMin) S.aMin=f.area;
      if(S.aMax===null||f.area>S.aMax) S.aMax=f.area;
    }
    // pressure が動く端末ならそれを使う（0〜1 正規化済みで校正不要）
    S.src=(S.pMin!==null&&(S.pMax-S.pMin)>0.02)?'pressure':'area';
  }
  function targetOf(f){
    if(S.src==='pressure') return clamp01(f.pressure);
    if(S.aMin===null) return 0;
    var span=S.aMax-S.aMin;
    if(span<1e-6) return 0.2;
    var lo=S.aMin, hi=S.aMax;
    if(span<lo*0.12) hi=lo+lo*0.12;
    return clamp01((f.area-lo)/(hi-lo));
  }

  // 合算：強い順に並べ、2本目以降の重みを段々小さくする。
  // 指を増やすほど1本あたりの効きが落ちるので、多点でも天井に張り付かず加減できる。
  // EXTRA = 2本目の重み、FALLOFF = 3本目以降の逓減率。ここだけで感度が決まる。
  var EXTRA=0.40, FALLOFF=0.62;
  function combine(list){
    var v=[],i;
    for(i=0;i<list.length;i++) v.push(list[i].s);
    if(!v.length) return 0;
    v.sort(function(a,b){ return b-a; });
    var total=v[0], w=EXTRA;
    for(i=1;i<v.length;i++){ total+=v[i]*w; w*=FALLOFF; }
    return Math.min(1,total);
  }

  /* ---------- カーブ ---------- */
  // 振動: 25%まで最小、55%から一気に、95%で最大
  function vibCurve(s){
    s=clamp01(s);
    if(s<=0.25) return 0;
    if(s<0.55) return ((s-0.25)/0.30)*0.12;
    var t=Math.min(1,(s-0.55)/0.40);
    return 0.12+(t*t*(3-2*t))*0.88;
  }
  // 見た目: 35%まで地味、55%から一気に、95%で最大
  function visCurve(s){
    s=clamp01(s);
    if(s<=0.35) return 0;
    if(s<0.55) return ((s-0.35)/0.20)*0.15;
    var t=Math.min(1,(s-0.55)/0.40);
    return 0.15+(t*t*(3-2*t))*0.85;
  }

  /* ---------- 音 ---------- */
  // 4系統を並列に組んでおき、ゲインで切り替える。切り替えでプツッと切れないよう 短くクロスフェードする。
  var A=null, audioUnlocked=false;
  var DBG=/[?&]debug=1/.test(location.search);
  // ?mediaout=1 で、出力を <audio> 要素経由に切り替える。
  // Android の画面録画がメディア再生しか拾わない場合の回避策。副作用の可能性があるので既定はオフ。
  var MEDIAOUT=/[?&]mediaout=1/.test(location.search);
  var mediaEl=null;
  // 並び順はここだけで決まる。先頭が既定。
  var ORDER=['arc','corona','hum','coil'];
  var NAME={coil:'コイル', arc:'アーク', corona:'コロナ', hum:'ハム'};
  var MODE_GAIN={coil:0.55, arc:0.85, corona:0.32, hum:0.75};   // 系統ごとに体感音量が違う
  var sndIdx=0;
  try{ var sv=localStorage.getItem('pt.snd2'); if(sv!==null) sndIdx=Math.min(ORDER.length-1,Math.max(0,parseInt(sv,10)||0)); }catch(e){}
  function curSnd(){ return ORDER[sndIdx]; }

  function audioCreate(){
    if(A) return A;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    var ac=new AC();

    var len=Math.floor(ac.sampleRate*2);
    var buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var noise=ac.createBufferSource(); noise.buffer=buf; noise.loop=true;

    var lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9500;
    var master=ac.createGain(); master.gain.value=0;
    lp.connect(master);

    if(MEDIAOUT && ac.createMediaStreamDestination){
      // 出力を MediaStream にして <audio> から鳴らす。スピーカー直結ではなくなる。
      var msd=ac.createMediaStreamDestination();
      master.connect(msd);
      mediaEl=document.createElement('audio');
      mediaEl.srcObject=msd.stream;
      mediaEl.setAttribute('playsinline','');
      mediaEl.autoplay=true;
      mediaEl.volume=1;
      mediaEl.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
      document.body.appendChild(mediaEl);
      var pp=mediaEl.play(); if(pp&&pp.catch) pp.catch(function(){});
    } else {
      master.connect(ac.destination);
    }
    function bus(){ var g=ac.createGain(); g.gain.value=0; g.connect(lp); return g; }
    var gA=bus(), gB=bus(), gC=bus(), gD=bus();

    // ① コイル — 方形波で規則的に断続させる（従来の音）
    var bpA=ac.createBiquadFilter(); bpA.type='bandpass'; bpA.frequency.value=1000; bpA.Q.value=1.5;
    var amA=ac.createGain(); amA.gain.value=0.34;
    var lfoA=ac.createOscillator(); lfoA.type='square'; lfoA.frequency.value=30;
    var lfoAD=ac.createGain(); lfoAD.gain.value=0.34;
    lfoA.connect(lfoAD); lfoAD.connect(amA.gain);
    var sawA=ac.createOscillator(); sawA.type='sawtooth'; sawA.frequency.value=30;
    var sawAG=ac.createGain(); sawAG.gain.value=0;
    noise.connect(bpA); bpA.connect(amA); amA.connect(gA);
    sawA.connect(sawAG); sawAG.connect(gA);

    // ② アーク — 火花を1発ずつ不規則に打つ。周期を持たせないのが要点。
    var bpB=ac.createBiquadFilter(); bpB.type='bandpass'; bpB.frequency.value=2600; bpB.Q.value=0.9;
    var sparkG=ac.createGain(); sparkG.gain.value=0.0008;
    noise.connect(bpB); bpB.connect(sparkG); sparkG.connect(gB);

    // ③ コロナ — 連続した高域のヒス。ゆっくりした揺らぎだけ。
    var hpC=ac.createBiquadFilter(); hpC.type='highpass'; hpC.frequency.value=2000;
    var amC=ac.createGain(); amC.gain.value=0.72;
    var lfoC=ac.createOscillator(); lfoC.type='sine'; lfoC.frequency.value=0.7;
    var lfoCD=ac.createGain(); lfoCD.gain.value=0.24;
    lfoC.connect(lfoCD); lfoCD.connect(amC.gain);
    noise.connect(hpC); hpC.connect(amC); amC.connect(gC);

    // ④ ハム — 低い唸り。変圧器のような重さ。
    var o1=ac.createOscillator(); o1.type='sine';     o1.frequency.value=48;
    var o2=ac.createOscillator(); o2.type='sine';     o2.frequency.value=96.7;
    var o3=ac.createOscillator(); o3.type='triangle'; o3.frequency.value=146;
    var g1=ac.createGain(); g1.gain.value=0.55;
    var g2=ac.createGain(); g2.gain.value=0.20;
    var g3=ac.createGain(); g3.gain.value=0.05;
    var lpD=ac.createBiquadFilter(); lpD.type='lowpass'; lpD.frequency.value=800;
    var nzD=ac.createGain(); nzD.gain.value=0.05;
    o1.connect(g1); o2.connect(g2); o3.connect(g3);
    g1.connect(gD); g2.connect(gD); g3.connect(gD);
    noise.connect(lpD); lpD.connect(nzD); nzD.connect(gD);

    try{ noise.start(0); lfoA.start(0); sawA.start(0); lfoC.start(0); o1.start(0); o2.start(0); o3.start(0); }catch(e){}

    A={ctx:ac, master:master, bus:{coil:gA, arc:gB, corona:gC, hum:gD},
       bpA:bpA, lfoA:lfoA, sawA:sawA, sawAG:sawAG,
       bpB:bpB, sparkG:sparkG,
       hpC:hpC, lfoC:lfoC,
       o1:o1,o2:o2,o3:o3,g3:g3};
    applySound(true);
    return A;
  }

  function applySound(instant){
    if(!A) return;
    var t=A.ctx.currentTime, tc=instant?0.001:0.09, k=curSnd();
    for(var key in A.bus){ A.bus[key].gain.setTargetAtTime(key===k?1:0,t,tc); }
  }

  // iOS の解錠。pointerdown だけでは開かないことがあるので touchend / click でも試し、
  // さらに「無音を1サンプル鳴らす」という手順を踏む。これが無いと resume() が通らない端末がある。
  function audioUnlock(){
    var a=audioCreate();
    if(!a) return;
    var ac=a.ctx;
    try{
      var b=ac.createBuffer(1,1,ac.sampleRate);
      var src=ac.createBufferSource();
      src.buffer=b; src.connect(ac.destination); src.start(0);
    }catch(e){}
    if(mediaEl && mediaEl.paused){ var mp=mediaEl.play(); if(mp&&mp.catch) mp.catch(function(){}); }
    if(ac.state!=='running'){
      var pr=ac.resume();
      if(pr&&pr.then) pr.then(function(){ audioUnlocked=(ac.state==='running'); }).catch(function(){});
    } else audioUnlocked=true;
  }
  ['touchstart','touchend','click','pointerdown'].forEach(function(ev){
    document.addEventListener(ev,audioUnlock,{passive:true});
  });

  // 見た目より下に床を作る。軽く触れただけでも小さく鳴る。
  function audioLevel(s){ return 0.12*Math.min(1,s*3)+0.88*visCurve(s); }

  // アーク用。1発ずつ時刻を決めて打つので、周期が揃わない。
  var sparkNext=0;
  function scheduleSparks(a){
    var ac=A.ctx, t=ac.currentTime, g=A.sparkG.gain;
    if(sparkNext<t+0.01) sparkNext=t+0.01;
    var rate=3+a*a*72, horizon=t+0.13, n=0;
    while(sparkNext<horizon && n++<40){
      var peak=(0.25+Math.random()*0.75)*(0.30+a*0.70);
      var dur=0.012+Math.random()*(0.045+a*0.07);
      g.setValueAtTime(0.0008, sparkNext);
      g.linearRampToValueAtTime(peak, sparkNext+0.0015);
      g.exponentialRampToValueAtTime(0.0008, sparkNext+dur);
      sparkNext += Math.max(0.006, (1/rate)*(0.30+Math.random()*1.4));
    }
  }

  function audioUpdate(s){
    if(!A) return;
    var t=A.ctx.currentTime, a=audioLevel(s);
    var j=1+(Math.random()-0.5)*0.12;

    var k=curSnd();
    if(k==='coil'){
      var rate=(26+a*118)*j;
      A.lfoA.frequency.setTargetAtTime(rate,t,0.03);
      A.sawA.frequency.setTargetAtTime(rate*0.5,t,0.03);
      A.bpA.frequency.setTargetAtTime((900+a*2700)*j,t,0.03);
      A.bpA.Q.setTargetAtTime(1.2+a*5,t,0.05);
      A.sawAG.gain.setTargetAtTime(a*a*0.06,t,0.04);
    } else if(k==='arc'){
      A.bpB.frequency.setTargetAtTime((1400+a*3800)*j,t,0.05);
      A.bpB.Q.setTargetAtTime(0.7+a*1.8,t,0.08);
      if(a>0.002) scheduleSparks(a);
    } else if(k==='corona'){
      A.hpC.frequency.setTargetAtTime(1400+a*4400,t,0.08);
      A.lfoC.frequency.setTargetAtTime(0.45+a*1.7,t,0.10);
    } else {
      var f=44+a*22;
      A.o1.frequency.setTargetAtTime(f,t,0.08);
      A.o2.frequency.setTargetAtTime(f*2.02,t,0.08);
      A.o3.frequency.setTargetAtTime(f*3.05,t,0.08);
      A.g3.gain.setTargetAtTime(0.015+a*0.16,t,0.08);
    }
    A.master.gain.setTargetAtTime(a*MODE_GAIN[k],t,0.03);
  }

  /* ---------- 3タップで音を切り替える ---------- */
  var sndEl=document.getElementById('sndName'), sndTmr=0;
  function showSound(){
    sndEl.textContent='音  '+NAME[curSnd()];
    sndEl.classList.add('show');
    clearTimeout(sndTmr);
    sndTmr=setTimeout(function(){ sndEl.classList.remove('show'); },1500);
  }
  var tapAt=0, tapN=0, tapSide=0;
  function registerTap(x,dur,moved,now){
    if(dur>320||moved>24){ tapN=0; return; }
    var side = x>S.W*0.68 ? 1 : (x<S.W*0.32 ? -1 : 0);
    if(!side){ tapN=0; return; }
    if(now-tapAt>700 || side!==tapSide){ tapN=0; tapSide=side; }
    tapAt=now; tapN++;
    if(tapN>=3){
      tapN=0;
      sndIdx=(sndIdx+(side>0?1:ORDER.length-1))%ORDER.length;
      try{ localStorage.setItem('pt.snd2',String(sndIdx)); }catch(e){}
      applySound(false);
      showSound();
    }
  }

  /* ---------- 振動（Web PWM） ---------- */
  var vibTimer=null;
  function pulseSpec(s){
    var u=vibCurve(s);
    var on=Math.max(3,Math.round(4+u*36));
    var period=Math.round(130-u*90);
    return {on:on, off:Math.max(0,period-on)};
  }
  // navigator.vibrate() は呼ぶたびに前のパターンを打ち切って鳴らし直す。
  // モーターは立ち上がりに10〜20msかかるので、無駄な打ち直しはそのまま弱さになる。
  // 刻みが変わっていないうちは打ち直さない ＝ 最大付近は本当に鳴りっぱなしになる。
  var vibKey='', vibAt=0;
  function vibFire(s,now){
    if(!navigator.vibrate) return;
    if(s<=0.005){ try{navigator.vibrate(0);}catch(e){} vibKey=''; return; }
    var sp=pulseSpec(s), key=sp.on+'/'+sp.off;
    var span=(sp.off===0)?900:600;                 // 1回で何ms分を予約するか
    if(key===vibKey && now-vibAt < span-140) return;
    var pat;
    if(sp.off===0){ pat=[span]; }
    else {
      pat=[]; var acc=0;
      while(acc<span && pat.length<120){ pat.push(sp.on); pat.push(sp.off); acc+=sp.on+sp.off; }
    }
    try{ navigator.vibrate(pat); }catch(e){}
    vibKey=key; vibAt=now;
  }
  function startVib(){
    if(vibTimer) return;
    vibFire(S.strength,performance.now());
    vibTimer=setInterval(function(){
      // 指を離しても、減衰が終わるまで追従させる
      if(!hasActive() && S.strength<0.03){ stopVib(); return; }
      vibFire(S.strength,performance.now());
    },90);
  }
  function stopVib(){
    if(vibTimer){ clearInterval(vibTimer); vibTimer=null; }
    vibKey='';
    try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
  }

  /* ---------- 稲妻 ---------- */
  function buildSeg(out,x0,y0,x1,y1,disp,depth,branch){
    if(depth<=0){ out.push(x0,y0,x1,y1); return; }
    var mx=(x0+x1)/2+(Math.random()-0.5)*disp;
    var my=(y0+y1)/2+(Math.random()-0.5)*disp;
    buildSeg(out,x0,y0,mx,my,disp*0.55,depth-1,branch);
    buildSeg(out,mx,my,x1,y1,disp*0.55,depth-1,branch);
    if(branch>0&&Math.random()<0.42){
      var bx=mx+(mx-x0)*0.9+(Math.random()-0.5)*disp;
      var by=my+(my-y0)*0.9+(Math.random()-0.5)*disp;
      buildSeg(out,mx,my,bx,by,disp*0.5,depth-1,branch-1);
    }
  }
  function strokeSegs(a,w,color){
    if(!a.length) return;
    ctx.strokeStyle=color; ctx.lineWidth=w;
    ctx.beginPath();
    for(var i=0;i<a.length;i+=4){ ctx.moveTo(a[i],a[i+1]); ctx.lineTo(a[i+2],a[i+3]); }
    ctx.stroke();
  }

  var sparks=[], rings=[], bloom=0, lastBloom=0;

  function drawCoil(v,breath){
    var c=coil;
    ctx.strokeStyle='#33485C'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(c.x-c.rx*1.5,c.baseY); ctx.lineTo(c.x+c.rx*1.5,c.baseY); ctx.stroke();
    ctx.strokeStyle='#2A3B4E'; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(var y=c.baseY-5;y>c.y+c.ry;y-=4.5){ ctx.moveTo(c.x-c.rx*0.42,y); ctx.lineTo(c.x+c.rx*0.42,y); }
    ctx.stroke();
    ctx.strokeStyle='rgba(116,214,255,'+(0.26+breath*0.14+v*0.6)+')';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(c.x,c.y,c.rx+v*4,c.ry+v*2,0,0,6.2832); ctx.stroke();
  }

  function draw(now){
    var W=S.W,H=S.H,c=coil,i,b;
    var vAll=visCurve(S.strength);                 // 全体の派手さ
    var breath=0.5+0.5*Math.sin(now/2600);

    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(5,8,12,'+(0.40-vAll*vAll*0.30)+')';
    ctx.fillRect(0,0,W,H);

    drawCoil(vAll,breath);

    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round'; ctx.lineJoin='round';

    var cr=c.rx*(0.9+breath*0.18)+vAll*Math.min(W,H)*0.16;
    var gc=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,cr);
    gc.addColorStop(0,'rgba(200,238,255,'+(0.16+breath*0.06+vAll*0.6)+')');
    gc.addColorStop(1,'rgba(80,180,255,0)');
    ctx.fillStyle=gc;
    ctx.beginPath(); ctx.arc(c.x,c.y,cr,0,6.2832); ctx.fill();

    var list=fingers(), n=list.length;
    var qAll=hasActive()?(0.10+vAll*0.90):vAll;

    // 離した指は 0.10 を下回ったら描かない。音と振動はこの後も減衰を続ける。
    var live=[], dead=[], fadeMax=0;
    for(i=0;i<n;i++){
      var fx=list[i];
      if(fx.active) live.push(fx);
      else if(fx.s>0.10){ dead.push(fx); if(fx.s>fadeMax) fadeMax=fx.s; }
    }

    if(live.length || dead.length){
      var segs=[], segsF=[], big=Math.max(W,H);
      var nDraw=Math.max(1,live.length+dead.length);
      var budget=Math.max(1, Math.round(11/nDraw));
      var tendrilBudget=Math.max(1, Math.round(14/nDraw));

      function emit(out,f,allowTendril){
        var vf=visCurve(f.s), disp=14+vf*84;
        var mainN=Math.min(budget, 1+Math.round(vf*5));
        for(var b=0;b<mainN;b++){
          var jx=f.x+(Math.random()-0.5)*(8+vf*30);
          var jy=f.y+(Math.random()-0.5)*(8+vf*30);
          buildSeg(out,c.x,c.y,jx,jy,disp,5,vf>0.25?3:1);
        }
        if(allowTendril && vf>0.25){
          var sp2=Math.min(tendrilBudget, Math.round((vf-0.25)*16));
          for(b=0;b<sp2&&out.length<6000;b++){
            var a3=Math.random()*6.2832, l3=22+Math.random()*(36+vf*100);
            buildSeg(out,f.x,f.y,f.x+Math.cos(a3)*l3,f.y+Math.sin(a3)*l3,16+vf*32,4,1);
          }
        }
      }

      for(i=0;i<live.length;i++) emit(segs,live[i],true);
      for(i=0;i<dead.length;i++) emit(segsF,dead[i],false);

      // トロイドから四方へ。ここは全体の強さで決まる。
      var st=Math.round(vAll*vAll*28);
      for(b=0;b<st&&segs.length<6000;b++){
        var ang=-0.08-Math.random()*Math.PI*0.84;
        var len=(0.22+Math.random()*0.78)*(0.32+vAll*0.90)*big;
        buildSeg(segs,c.x,c.y,c.x+Math.cos(ang)*len,c.y+Math.sin(ang)*len,20+vAll*72,4,vAll>0.45?2:1);
      }

      strokeSegs(segs, 5+vAll*20,   'rgba(80,30,170,'+(0.06+qAll*0.20)+')');
      strokeSegs(segs, 2.2+vAll*6,  'rgba(50,160,255,'+(0.14+qAll*0.36)+')');
      strokeSegs(segs, 0.9+vAll*2.0,'rgba(225,248,255,'+(0.34+qAll*0.62)+')');

      // 離した指のぶんは、その指の残量に比例して暗く描く
      if(segsF.length){
        var fm=fadeMax*fadeMax;
        strokeSegs(segsF, 4+fadeMax*10,   'rgba(80,30,170,'+(0.06*fm)+')');
        strokeSegs(segsF, 1.8+fadeMax*3,  'rgba(50,160,255,'+(0.22*fm)+')');
        strokeSegs(segsF, 0.8+fadeMax*1.2,'rgba(225,248,255,'+(0.45*fm)+')');
      }

      var want=Math.round(vAll*vAll*7);
      for(b=0;b<want&&sparks.length<150&&live.length;b++){
        var src=live[(Math.random()*live.length)|0];
        var a2=Math.random()*6.2832, vv=1.6+Math.random()*(3+vAll*9);
        sparks.push({x:src.x,y:src.y,vx:Math.cos(a2)*vv,vy:Math.sin(a2)*vv,l:1});
      }
      if(vAll>0.35&&now-lastBloom>Math.max(220,700-vAll*420)){
        rings.push({x:c.x,y:c.y,r:c.rx,l:1});
        if(vAll>0.6){ bloom=Math.min(1,bloom+0.55); }
        lastBloom=now;
      }
    }

    for(i=sparks.length-1;i>=0;i--){
      var pt=sparks[i];
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.13; pt.vx*=0.984; pt.vy*=0.984; pt.l-=0.030;
      if(pt.l<=0){ sparks.splice(i,1); continue; }
      ctx.strokeStyle='rgba(200,240,255,'+pt.l+')'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(pt.x,pt.y); ctx.lineTo(pt.x-pt.vx*2.2,pt.y-pt.vy*2.2); ctx.stroke();
    }
    for(i=rings.length-1;i>=0;i--){
      var r=rings[i];
      r.r+=5+vAll*14; r.l-=0.032;
      if(r.l<=0){ rings.splice(i,1); continue; }
      ctx.strokeStyle='rgba(110,200,255,'+(r.l*0.34)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.2832); ctx.stroke();
    }

    // 指先の光は1本ずつ。離した指は残量そのものに比例させ、崖なく消す。
    for(i=0;i<n;i++){
      var ff=list[i], vff=visCurve(ff.s);
      var qf=ff.active?(0.10+vff*0.90):(ff.s*ff.s*0.9);
      if(qf<=0.02) continue;
      var rr=ff.active ? (16+vff*vff*Math.max(W,H)*0.46)
                       : (10+ff.s*ff.s*Math.max(W,H)*0.28);
      var g=ctx.createRadialGradient(ff.x,ff.y,0,ff.x,ff.y,rr);
      g.addColorStop(0,'rgba(255,255,255,'+(0.30+qf*0.60)+')');
      g.addColorStop(0.28,'rgba(140,220,255,'+(0.14+qf*0.34)+')');
      g.addColorStop(1,'rgba(90,140,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(ff.x,ff.y,rr,0,6.2832); ctx.fill();
    }

    if(vAll>0.25){ ctx.fillStyle='rgba(30,90,170,'+((vAll-0.25)*0.20)+')'; ctx.fillRect(0,0,W,H); }
    if(bloom>0.002){
      ctx.fillStyle='rgba(185,222,255,'+(bloom*bloom*0.20)+')';
      ctx.fillRect(0,0,W,H);
      bloom*=0.90;
    } else bloom=0;

    ctx.globalCompositeOperation='source-over';
  }

  function tick(now){
    now=now||0;
    var id,i;
    // 接地中の指：目標へ追従（平滑化は最小限。微小な揺れが手触りの源）
    for(id in P){
      var f=P[id];
      f.target=targetOf(f);
      f.s += (f.target-f.s)*0.35;
    }
    // 離した指：ゆっくり落として、消えたら破棄
    for(i=FADE.length-1;i>=0;i--){
      var g=FADE[i];
      g.s += (0-g.s)*0.055;
      if(g.s<0.003) FADE.splice(i,1);
    }
    S.strength=combine(fingers());

    audioUpdate(S.strength);
    if(DBG) dbgUpdate();

    draw(now);
    requestAnimationFrame(tick);
  }

  /* ---------- 入力（多点） ---------- */
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();
    var f={ id:e.pointerId, active:true, x:e.clientX, y:e.clientY,
            pressure:NaN, area:NaN, w:NaN, h:NaN, target:0, s:0,
            downT:performance.now(), downX:e.clientX, downY:e.clientY,
            solo:(countActive()===0) };
    // 2本目が降りた時点で、それまでの指は「単独タップ」ではなくなる
    if(!f.solo){ for(var id in P) P[id].solo=false; }
    P[e.pointerId]=f;
    readPointer(f,e);
    // 一瞬のタップでも取りこぼさないよう、押した時点で立ち上げておく
    var t0=targetOf(f);
    f.s=t0*0.55;
    audioUnlock();
    document.body.classList.add('live');
    hintEl.classList.add('gone');
    startVib();
  });

  cv.addEventListener('pointermove',function(e){
    var f=P[e.pointerId];
    if(!f) return;
    e.preventDefault();
    readPointer(f,e);
  });

  function release(e,isTap){
    var f=P[e.pointerId];
    if(!f) return;
    delete P[e.pointerId];
    f.active=false;
    FADE.push(f);                                  // 振動・音・光は減衰に追従する
    if(isTap && f.solo && typeof e.clientX==='number'){
      var now=performance.now();
      var dx=e.clientX-f.downX, dy=e.clientY-f.downY;
      registerTap(e.clientX, now-f.downT, Math.sqrt(dx*dx+dy*dy), now);
    }
  }
  cv.addEventListener('pointerup',function(e){ release(e,true); });
  cv.addEventListener('pointercancel',function(e){ release(e,false); tapN=0; });
  // 取りこぼし防止：canvas の外で離した場合も必ず解放する
  window.addEventListener('pointerup',function(e){ release(e,false); });
  window.addEventListener('pointercancel',function(e){ release(e,false); });
  cv.addEventListener('lostpointercapture',function(e){ release(e,false); });
  window.addEventListener('blur',function(){
    for(var id in P){ P[id].active=false; FADE.push(P[id]); }
    P={};
  });

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      P={}; FADE=[]; S.strength=0; stopVib();
      if(A){ try{ A.master.gain.value=0; }catch(e){} }
    }
  });

  /* ---------- 診断（?debug=1 のときだけ出る） ---------- */
  var dbgEl=null;
  function dbgUpdate(){
    if(!dbgEl){
      dbgEl=document.createElement('div');
      dbgEl.style.cssText='position:fixed;left:8px;top:8px;z-index:9;font:11px/1.5 ui-monospace,monospace;'+
        'color:#9fe;background:rgba(0,0,0,.6);padding:6px 8px;pointer-events:none;white-space:pre';
      document.body.appendChild(dbgEl);
    }
    var a=A?A.ctx:null;
    dbgEl.textContent=
      'AudioContext : '+(a?'あり':'なし')+'\n'+
      'state        : '+(a?a.state:'-')+'\n'+
      'unlocked     : '+audioUnlocked+'\n'+
      'sampleRate   : '+(a?a.sampleRate:'-')+'\n'+
      'master.gain  : '+(a?A.master.gain.value.toFixed(3):'-')+'\n'+
      'strength     : '+S.strength.toFixed(3)+'\n'+
      'fingers      : '+countActive()+' (+'+FADE.length+')\n'+
      'vibrate      : '+(!!navigator.vibrate)+'\n'+
      'sound        : '+sndIdx+' '+NAME[curSnd()]+'\n'+
      'mediaout     : '+MEDIAOUT+(mediaEl?(mediaEl.paused?' (paused)':' (playing)'):'');
  }

  /* ---------- 起動 ---------- */
  measure();
  requestAnimationFrame(tick);

  // ホーム画面に追加できるようにする（埋め込み枠の中では登録しない）
  if('serviceWorker' in navigator && window.top===window.self){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
